<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">India Market Scanner</title>
  <desc id="d">Banner with a rising candlestick chart and four mode chips: Scan, Budget plan, Sell check and IPO desk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16294A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9933"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .g { fill: #2ECC71; stroke: #2ECC71; }
      .r { fill: #F05D5E; stroke: #F05D5E; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .live { animation: pulse 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- watermark -->
  <text x="930" y="268" class="t" font-size="260" font-weight="800" fill="#FF9933" fill-opacity="0.07" text-anchor="middle">₹</text>

  <!-- baseline and trend -->
  <line x1="710" y1="268" x2="1150" y2="268" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <path d="M730 232 L1126 112" stroke="#FFD166" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.7"/>

  <!-- candles (illustrative) -->
  <g class="g"><line x1="730" y1="205" x2="730" y2="255" stroke-width="2"/><rect x="721" y="220" width="18" height="25" rx="2"/></g>
  <g class="r"><line x1="766" y1="195" x2="766" y2="250" stroke-width="2"/><rect x="757" y="225" width="18" height="17" rx="2"/></g>
  <g class="g"><line x1="802" y1="190" x2="802" y2="240" stroke-width="2"/><rect x="793" y="200" width="18" height="32" rx="2"/></g>
  <g class="r"><line x1="838" y1="180" x2="838" y2="232" stroke-width="2"/><rect x="829" y="205" width="18" height="20" rx="2"/></g>
  <g class="g"><line x1="874" y1="170" x2="874" y2="225" stroke-width="2"/><rect x="865" y="180" width="18" height="38" rx="2"/></g>
  <g class="g"><line x1="910" y1="160" x2="910" y2="215" stroke-width="2"/><rect x="901" y="172" width="18" height="33" rx="2"/></g>
  <g class="r"><line x1="946" y1="165" x2="946" y2="210" stroke-width="2"/><rect x="937" y="185" width="18" height="18" rx="2"/></g>
  <g class="g"><line x1="982" y1="145" x2="982" y2="200" stroke-width="2"/><rect x="973" y="155" width="18" height="35" rx="2"/></g>
  <g class="g"><line x1="1018" y1="130" x2="1018" y2="185" stroke-width="2"/><rect x="1009" y="140" width="18" height="35" rx="2"/></g>
  <g class="r"><line x1="1054" y1="125" x2="1054" y2="170" stroke-width="2"/><rect x="1045" y="148" width="18" height="17" rx="2"/></g>
  <g class="g"><line x1="1090" y1="105" x2="1090" y2="160" stroke-width="2"/><rect x="1081" y="115" width="18" height="35" rx="2"/></g>
  <g class="g live"><line x1="1126" y1="85" x2="1126" y2="140" stroke-width="2"/><rect x="1117" y="95" width="18" height="35" rx="2"/></g>

  <text x="1150" y="292" class="t" font-size="12" fill="#8FA3C0" text-anchor="end">illustrative chart, not real data</text>

  <!-- title block -->
  <rect x="60" y="48" width="64" height="6" rx="3" fill="url(#accent)"/>
  <text x="60" y="112" class="t" font-size="50" font-weight="800" fill="#E6EDF7">India Market Scanner</text>
  <text x="60" y="158" class="t" font-size="20" fill="#B8C7DE">Live-data market scans, budget plans and IPO verdicts</text>
  <text x="60" y="186" class="t" font-size="20" fill="#B8C7DE">for NSE &amp; BSE, built as a Claude skill</text>

  <!-- mode chips -->
  <g class="t" font-size="14" font-weight="700" letter-spacing="1.2" text-anchor="middle">
    <rect x="60" y="214" width="88" height="34" rx="17" fill="#4DA3FF" fill-opacity="0.12" stroke="#4DA3FF"/>
    <text x="104" y="236" fill="#4DA3FF">SCAN</text>
    <rect x="158" y="214" width="148" height="34" rx="17" fill="#2ECC71" fill-opacity="0.12" stroke="#2ECC71"/>
    <text x="232" y="236" fill="#2ECC71">BUDGET PLAN</text>
    <rect x="316" y="214" width="136" height="34" rx="17" fill="#F05D5E" fill-opacity="0.12" stroke="#F05D5E"/>
    <text x="384" y="236" fill="#F05D5E">SELL CHECK</text>
    <rect x="462" y="214" width="116" height="34" rx="17" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA"/>
    <text x="520" y="236" fill="#A78BFA">IPO DESK</text>
  </g>

  <text x="60" y="290" class="t" font-size="14" fill="#8FA3C0">Open source · MIT · Educational research, not investment advice</text>
</svg>
